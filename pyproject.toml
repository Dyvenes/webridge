[project]
name = "webbridge"
version = "0.1.0"
description = "Local OpenAI-compatible bridge over web AI chat accounts"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "playwright>=1.48",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "aiosqlite>=0.20",
    "structlog>=24.4",
    "typer>=0.12",
    "keyring>=25.5",
    "jsonschema>=4.23",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "hypothesis>=6.115", "python-multipart>=0.0.9"]

[project.scripts]
webbridge = "webbridge.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/webbridge"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
